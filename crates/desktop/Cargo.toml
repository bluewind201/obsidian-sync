[package]
name = "obsidian-sync-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Obsidian Sync & Notion-style Markdown Studio (TOAST UI Editor + Rust Sync Engine)"

[[bin]]
name = "ObsidianSync"
path = "src/main.rs"

[dependencies]
obsidian-sync-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
notify = { version = "6.1", default-features = false }
directories = "5"
open = "5"
log = "0.4"
percent-encoding = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
tray-icon = "0.25"
rfd = "0.15"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
