[package]
name = "obsidian-sync-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Onyx Studio — Pure Native Rust (eframe/egui) Markdown Studio, AES-256 Encryption & Multi-Cloud Sync (Zero WebView2 / Zero Port)"

[lib]
name = "obsidian_sync_desktop"
path = "src/lib.rs"

[[bin]]
name = "OnyxStudio"
path = "src/main.rs"

[dependencies]
obsidian-sync-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
notify = { version = "6.1", default-features = false }
log = "0.4"
percent-encoding = "2"
base64 = "0.22"
ring = "0.17"
zeroize = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "5"
open = "5"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
sha2 = "0.10"
hex = "0.4"
tray-icon = "0.25"
rfd = "0.15"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[target.'cfg(all(not(windows), not(target_os = "android")))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[dev-dependencies]
tempfile = "3"
