[package]
name = "obsidian-sync-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Obsidian Sync - Windows 데스크톱 앱"

[[bin]]
name = "ObsidianSync"
path = "src/main.rs"

[dependencies]
obsidian-sync-core = { path = "../core" }
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
directories = "5"
open = "5"
log = "0.4"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
rfd = "0.15"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

