[package]
name = "obsidian-sync-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Onyx Studio - Android JNI 연결부"

[lib]
name = "obsidian_sync"
crate-type = ["cdylib", "rlib"]

[dependencies]
obsidian-sync-core = { path = "../core" }
obsidian-sync-desktop = { path = "../desktop" }
anyhow = "1"
serde_json = "1"
percent-encoding = "2"
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"
