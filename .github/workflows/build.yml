name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p vault-sync-core
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p obsidian-sync
      - run: cargo test --locked -p vault-sync-core
      - run: |
          New-Item -ItemType Directory dist
          Copy-Item target/release/obsidian-sync.exe dist/
          Copy-Item README.md dist/
          Copy-Item -Recurse docs dist/
          Compress-Archive -Path dist/* -DestinationPath obsidian-sync-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: obsidian-sync-windows-x64.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build Rust JNI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --locked --release -p vault-sync-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable preview APK
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd android && gradle connectedDebugAndroidTest --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n io.bluewind.obsidiansync/.MainActivity
            sleep 2
            adb exec-out screencap -p > android-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android-preview.png
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: android/app/build/outputs/apk/debug/*.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-preview'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: windows-x64
      - run: sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/*
          --prerelease
          --title "Obsidian Sync $RELEASE_TAG preview"
          --notes 'Windows x64 portable app and Android arm64/x86_64 preview APK. Android is debug-signed for evaluation; future builds may require reinstalling. Back up your vault before first use. Cloud adapters require your own credentials and have not been tested against your accounts. See README and provider setup guide. Not affiliated with Obsidian.'
