name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p obsidian-sync-core -p obsidian-sync-android

  windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p obsidian-sync-core
      - run: cargo build --locked --release -p obsidian-sync-desktop
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Copy-Item target/release/ObsidianSync.exe dist/
          Copy-Item README.md dist/
          Copy-Item docs/SETUP.md dist/
          Compress-Archive -Path dist/* -DestinationPath ObsidianSync-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ObsidianSync-windows-x64.zip

  android:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Version name
        run: echo "VERSION_NAME=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-b${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build Rust JNI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --locked --release -p obsidian-sync-android
      - name: Signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease assembleDebug lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd android && gradle connectedDebugAndroidTest --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n io.bluewind.obsidiansync/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-preview.png
      - run: cp android/app/build/outputs/apk/release/app-release.apk ObsidianSync-android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android-preview.png
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ObsidianSync-android.apk

  # 태그 v* 를 직접 올리거나 workflow_dispatch 수동 실행 시 릴리즈
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: windows-x64
      - run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$HAS_KEY" == "true" ]]; then SIGN_NOTE=""; else SIGN_NOTE="  - ⚠ 이 APK는 임시 키로 서명되어 이전 버전 위에 업데이트할 수 없습니다. 기존 앱을 지운 뒤 설치하세요 (서명 키 설정: docs/SETUP.md)."; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"; fi
          cat > notes.md <<NOTES
          ## 받는 법
          - **Windows**: \`ObsidianSync-windows-x64.zip\` 압축을 풀고 \`ObsidianSync.exe\` 실행
          - **Android**: \`ObsidianSync-android.apk\` 설치. 앱의 "앱 업데이트"에서 새 버전을 자동으로 받아 설치할 수 있습니다.
          ${SIGN_NOTE}

          처음 사용할 때는 볼트를 백업한 뒤 시작하세요. 저장소별 설정 방법은 [설정 안내](https://github.com/${GH_REPO}/blob/main/docs/SETUP.md)를 참고하세요.

          커밋: ${GITHUB_SHA::7}
          NOTES
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "Obsidian Sync $TAG" --notes-file notes.md --latest
