name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p vault-sync-core
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p obsidian-sync
      - run: |
          New-Item -ItemType Directory dist
          Copy-Item target/release/obsidian-sync.exe dist/
          Copy-Item README.md dist/
          Copy-Item -Recurse docs dist/
          Compress-Archive -Path dist/* -DestinationPath obsidian-sync-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: obsidian-sync-windows-x64.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Build Rust JNI
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p vault-sync-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable preview APK
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: android/app/build/outputs/apk/debug/*.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}' artifacts/*
          --repo '${{ github.repository }}' --prerelease
          --title 'Obsidian Sync ${{ github.ref_name }} preview'
          --notes 'Windows x64 portable app and Android arm64/x86_64 preview APK. Android is debug-signed for evaluation; future builds may require reinstalling. Back up your vault before first use. Cloud adapters require your own credentials and have not been tested against your accounts. See README and provider setup guide. Not affiliated with Obsidian.'
