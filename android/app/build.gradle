plugins { id 'com.android.application' }

def localSigningProps = new Properties()
def localSigningPropsFile = file("D:/BuildToolset/signing/signing.properties")
if (localSigningPropsFile.exists()) {
    localSigningPropsFile.withInputStream { localSigningProps.load(it) }
}
def localVc = 100
def vcFile = file("D:/BuildToolset/signing/version-codes.json")
if (vcFile.exists()) {
    def m = (vcFile.text =~ /"ObsidianSync"\s*:\s*(\d+)/)
    if (m.find()) { localVc = Math.max(100, m.group(1).toInteger()) }
}

android {
    namespace 'io.bluewind.obsidiansync'
    compileSdk 35
    defaultConfig {
        applicationId 'io.bluewind.obsidiansync'
        minSdk 30
        targetSdk 35
        // 로컬 PC(D:\BuildToolset\signing\version-codes.json) 또는 BUILD_NUMBER로 버전 코드가 자동 증가합니다
        versionCode((System.getenv('BUILD_NUMBER') ?: localVc.toString()).toInteger())
        versionName(System.getenv('VERSION_NAME') ?: '1.1.1')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    // 서명 키: 로컬 PC D:\BuildToolset\signing\obsidiansync-release.jks 고정 릴리스 키 우선 사용
    def ksPath = System.getenv('ANDROID_KEYSTORE_FILE') ?: localSigningProps.getProperty('OBSIDIANSYNC_KEYSTORE')
    def ksPw = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: localSigningProps.getProperty('KEYSTORE_PASSWORD')
    def ksAlias = System.getenv('ANDROID_KEY_ALIAS') ?: localSigningProps.getProperty('OBSIDIANSYNC_KEY_ALIAS') ?: 'obsidiansync'
    def ksFile = ksPath ? file(ksPath) : null
    def hasKs = (ksFile != null && ksFile.exists() && ksPw)
    signingConfigs {
        if (hasKs) {
            release {
                storeFile ksFile
                storePassword ksPw
                keyAlias ksAlias
                keyPassword(System.getenv('ANDROID_KEY_PASSWORD') ?: ksPw)
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            signingConfig?.with {
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
        debug { if (hasKs) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
