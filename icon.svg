<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#130924"/>
        <stop offset="50%" stop-color="#2E1065"/>
        <stop offset="100%" stop-color="#0F172A"/>
      </linearGradient>
      <radialGradient id="aura" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
        <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gemLeft" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#E9D5FF"/>
        <stop offset="50%" stop-color="#A855F7"/>
        <stop offset="100%" stop-color="#6B21A8"/>
      </linearGradient>
      <linearGradient id="gemRight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#C084FC"/>
        <stop offset="55%" stop-color="#7E22CE"/>
        <stop offset="100%" stop-color="#3B0764"/>
      </linearGradient>
      <linearGradient id="gemCenter" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F3E8FF"/>
        <stop offset="35%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#581C87"/>
      </linearGradient>
      <linearGradient id="syncArc1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#22D3EE"/>
        <stop offset="100%" stop-color="#A855F7"/>
      </linearGradient>
      <linearGradient id="syncArc2" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#F472B6"/>
        <stop offset="100%" stop-color="#38BDF8"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#05020A" flood-opacity="0.7"/>
      </filter>
    </defs>
    <rect x="44" y="44" width="936" height="936" rx="220" fill="url(#bg)"/>
    <rect x="44" y="44" width="936" height="936" rx="220" fill="url(#aura)"/>
    <rect x="52" y="52" width="920" height="920" rx="212" fill="none" stroke="#A855F7" stroke-width="10" stroke-opacity="0.4"/>

    <!-- Dual Orbit Sync Rings -->
    <g filter="url(#shadow)">
      <path d="M210 470 A305 305 0 0 1 790 380" fill="none" stroke="url(#syncArc1)" stroke-width="46" stroke-linecap="round"/>
      <polygon points="828,425 836,306 726,356" fill="#22D3EE"/>

      <path d="M814 554 A305 305 0 0 1 234 644" fill="none" stroke="url(#syncArc2)" stroke-width="46" stroke-linecap="round"/>
      <polygon points="196,599 188,718 298,668" fill="#F472B6"/>
    </g>

    <!-- Faceted Obsidian Crystal Core -->
    <g filter="url(#shadow)">
      <polygon points="512,210 340,420 512,370" fill="url(#gemLeft)"/>
      <polygon points="512,210 684,420 512,370" fill="url(#gemRight)"/>
      <polygon points="340,420 512,370 512,814 316,590" fill="url(#gemCenter)"/>
      <polygon points="684,420 512,370 512,814 708,590" fill="url(#gemRight)"/>
      <polygon points="512,210 442,390 512,814 582,390" fill="#F3E8FF" fill-opacity="0.28"/>
      <polyline points="340,420 512,370 684,420" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.65"/>
      <line x1="512" y1="210" x2="512" y2="814" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.55"/>
    </g>
  </svg>